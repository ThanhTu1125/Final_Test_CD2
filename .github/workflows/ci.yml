name: CI Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # JOB 1: Kiểm thử tự động đa trình duyệt trên môi trường chuẩn (PROD / Docker)
  # Đáp ứng Mục 3.9 (Matrix 3 trình duyệt), Mục 3.10 (Artifacts), Mục 3.11 (Reruns)
  # ============================================================================
  e2e-prod-matrix:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser (${{ matrix.browser }})
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Start local Toolshop Docker container (Bypass Cloudflare blocking)
        run: |
          if [ ! -d "toolshop" ]; then
            git clone --depth 1 https://github.com/testsmith-io/practice-software-testing.git toolshop || true
          fi
          if [ -d "toolshop" ] && [ -f "toolshop/docker-compose.yml" ]; then
            cd toolshop
            docker compose up -d || true
            echo "Waiting for local Toolshop services to become ready..."
            for i in {1..30}; do
              if curl -s http://localhost:8091/status >/dev/null && curl -s http://localhost:4200 >/dev/null; then
                echo "Local Toolshop Docker containers are up!"
                docker compose exec -T laravel-api php artisan migrate:fresh --seed --force || true
                echo "BASE_URL=http://localhost:4200" >> $GITHUB_ENV
                echo "API_URL=http://localhost:8091" >> $GITHUB_ENV
                echo "ROUTE_PREFIX=" >> $GITHUB_ENV
                break
              fi
              sleep 3
            done
          fi

      - name: Run Playwright test suite on ${{ matrix.browser }} with rerunfailures
        env:
          BASE_URL: ${{ env.BASE_URL || 'https://practicesoftwaretesting.com' }}
          API_URL: ${{ env.API_URL || 'https://api.practicesoftwaretesting.com' }}
          ROUTE_PREFIX: ${{ env.ROUTE_PREFIX || '' }}
        run: |
          pytest \
            --browser ${{ matrix.browser }} \
            --reruns 2 \
            --reruns-delay 2 \
            --tracing=retain-on-failure \
            --screenshot=only-on-failure \
            --html=report-${{ matrix.browser }}.html \
            --self-contained-html \
            -v

      - name: Upload HTML Report & Failure Traces/Screenshots (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.browser }}
          path: |
            report-${{ matrix.browser }}.html
            test-results/
          retention-days: 14

  # ============================================================================
  # JOB 2: Kiểm thử hồi quy đối soát trên môi trường BUGGY (Săn lỗi hệ thống)
  # Đáp ứng Mục 3.12 (Chạy nguyên bộ test trên BUGGY với continue-on-error: true)
  # ============================================================================
  buggy-regression:
    name: Regression Hunt on BUGGY Environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    env:
      BASE_URL: https://with-bugs.practicesoftwaretesting.com
      API_URL: https://api-with-bugs.practicesoftwaretesting.com
      ROUTE_PREFIX: /#

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run full regression suite against BUGGY environment
        run: |
          pytest \
            --browser chromium \
            --tracing=retain-on-failure \
            --screenshot=only-on-failure \
            --html=report-buggy.html \
            --self-contained-html \
            -v

      - name: Upload BUGGY Regression Report, Screenshots & Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-buggy-regression-artifacts
          path: |
            report-buggy.html
            test-results/
          retention-days: 14

