[pytest]
addopts = 
    --tracing=retain-on-failure 
    --screenshot=only-on-failure 
    --html=report.html 
    --self-contained-html
testpaths = tests
markers =
    smoke: Các test case cốt lõi kiểm tra nhanh hệ thống (chạy qua pytest -m smoke)
    regression: Toàn bộ bộ test hồi quy
    api: Các test case kiểm thử REST API qua APIRequestContext
    ui: Các test case kiểm thử giao diện người dùng
    bdd: Các kịch bản kiểm thử theo hướng hành vi BDD
    slow: Các test case chạy chậm cần lưu ý
